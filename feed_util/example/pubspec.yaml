# Dir is examples/flutter (matches android/ios); the pub package name can't be
# the literal `flutter` — that collides with the Flutter SDK package.
name: feed_util_flutter_example
description: 'Example external Flutter app consuming the feed_util Livestream SDK as a Dart package.'
publish_to: 'none'
version: 1.0.0+1

# Standalone release example.

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The SDK under test, resolved from the sibling source package.
  feed_util:
    path: ../

  # In-app browser for the livestream web page a tapped card opens.
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
